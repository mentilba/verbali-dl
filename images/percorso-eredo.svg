<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arrowFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9C2DC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5A4394" stop-opacity="0.95"/>
